name = "chuanshu-engine"
main = "worker/index.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# KV 命名空间：部署前执行
#   npx wrangler kv namespace create SESSION_KV
#   npx wrangler kv namespace create SAVE_KV
# 然后把返回的 id 填到下面
[[kv_namespaces]]
binding = "SESSION_KV"
id = "f7304fb341c04f75a7fa10b8f74b3029"

[[kv_namespaces]]
binding = "SAVE_KV"
id = "d9a081dc65544cc6b048be41ae5e05da"

# 长期记忆库（worker/memory.js）：D1 绑定暂缓——当前 wrangler OAuth 令牌无 D1 权限
# （Authentication error 10000）。启用步骤：
#   1. npx wrangler login（浏览器重新授权，勾选 D1 权限）
#   2. npx wrangler d1 create chuanshu-memory
#   3. 把返回的 database_id 填到下面并解开注释
#   4. npx wrangler d1 migrations apply chuanshu-memory --remote && npx wrangler deploy
# 未绑定期间 memory.js 自动降级 SAVE_KV（save:/mem:/summ: 前缀），云存档照常工作
# [[d1_databases]]
# binding = "DB"
# database_name = "chuanshu-memory"
# database_id = "TODO_replace_after_d1_create"
# migrations_dir = "migrations"

[vars]
# 公开配置；密钥走 wrangler secret put
ZHIHU_OAUTH_APP_ID = "442"
ZHIHU_OAUTH_REDIRECT_URI = "https://chuanshu-engine.xyz/auth/callback"
LLM_BASE_URL = "https://api.openai-next.com/v1"
LLM_MODEL = "qwen3.8-max"
LLM_MODEL_FALLBACK = "qwen3-max"

# Secrets（不写入本文件）：
#   npx wrangler secret put ZHIHU_OAUTH_APP_KEY
#   npx wrangler secret put LLM_API_KEY
