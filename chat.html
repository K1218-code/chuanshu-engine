<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>穿书引擎 · 剧情体验</title>
<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/chat.css">
</head>
<body>
<div id="app">
  <div class="topbar">
    <button class="back" id="btn-back">← 书架</button>
    <span class="title" id="book-title">剧情体验</span>
    <span class="sub" id="whoami"></span>
    <button class="back" id="btn-reset" title="清空进度，重新开始">↺</button>
  </div>
  <div class="statbar im" id="statbar"></div>
  <div class="chat-stage">
    <div class="msgs" id="msgs"></div>
    <div class="quick-choices" id="quick"></div>
    <div class="input-bar">
      <input id="input" type="text" maxlength="120" placeholder="说点什么……（回车发送）">
      <button id="send">发送</button>
    </div>
  </div>
  <div class="footer-note">AI 生成内容 · 剧情推进按钮沿原作主线 · 自由对话由叙事引擎生成</div>
</div>
<div class="mode-badge" id="mode-badge" hidden>本地预置模式</div>
<script type="module" src="./js/chat.page.js"></script>
</body>
</html>
