<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>穿书引擎 · 把故事穿进去玩</title>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/home.css">
</head>
<body>
<div id="app">
  <div class="topbar">
    <span class="title">书架</span>
    <button class="back" id="login-btn">知乎登录</button>
  </div>

  <div class="hero">
    <div class="kanshan">🦊</div>
    <div class="logo">穿<span>书</span>引擎</div>
    <p>读完意难平？穿进去玩。—— 确定性引擎管命运，AI 只把角色演活</p>
  </div>

  <div class="section">
    <div class="section-title">📚 精选书库 <small>已拆解 · 即点即玩</small></div>
    <div id="book-list"></div>
  </div>

  <div class="section">
    <div class="section-title">✨ 更多入口</div>
    <div class="entry-row">
      <div class="card entry" id="entry-create">
        <div class="ico">🌍</div><h4>创造世界</h4><p>30 秒生成你的世界</p>
      </div>
      <div class="card entry" id="entry-all">
        <div class="ico">🔍</div><h4>全部故事</h4><p>任选一本 · 现场生成</p>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">🏆 结局图鉴 <small id="gallery-count"></small></div>
    <div class="card gallery-strip" id="gallery"></div>
  </div>

  <div class="footer-note">穿书引擎 · 知乎黑客松 2026 · 互动内容由 AI 基于盐言故事生成</div>
</div>
<div id="toast-root"></div>
<script type="module" src="/js/home.page.js"></script>
</body>
</html>
