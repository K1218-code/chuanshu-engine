<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>穿书引擎 · AVG</title>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/avg.css">
</head>
<body>
<div id="app">
  <div class="topbar">
    <button class="back" id="btn-back">← 书架</button>
    <span class="title" id="book-title">加载中…</span>
    <span class="sub" id="chapter-label"></span>
  </div>
  <div class="statbar" id="statbar"></div>
  <div class="stage" id="stage">
    <div class="chapter-badge" id="chapter-badge"></div>
    <div class="vn-box" id="vn-box">
      <div class="name-tag" id="who"></div>
      <div class="dialog" id="dialog"><span id="txt"></span><span class="cursor" id="cursor"></span>
        <span class="next-hint" id="next-hint">点击继续 ▾</span></div>
      <div class="choices" id="choices"></div>
    </div>
  </div>
  <div class="footer-note">内容由 AI 基于原作改编生成 · 仅供比赛演示</div>
</div>

<div class="overlay" id="id-overlay" hidden>
  <div class="panel">
    <div class="fam" style="letter-spacing:2px;color:var(--text-3)">穿书引擎</div>
    <h2 id="id-title">选择你要穿成的人</h2>
    <div class="sub" id="id-sub"></div>
    <div id="id-list"></div>
  </div>
</div>

<div class="overlay" id="end-overlay" hidden>
  <div class="panel ending-card">
    <div class="fam" id="end-family"></div>
    <h1 id="end-title"></h1>
    <div class="tone" id="end-tone"></div>
    <div class="epilogue" id="end-epilogue"></div>
    <div class="ending-stats" id="end-stats"></div>
    <div class="ending-actions">
      <button class="btn" id="btn-restart">再穿一次</button>
      <button class="btn ghost" id="btn-home2">回到书架</button>
    </div>
    <div style="margin-top:14px"><span class="rare" id="end-rare"></span></div>
  </div>
</div>

<script type="module" src="/js/avg.page.js"></script>
</body>
</html>
