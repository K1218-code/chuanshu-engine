name = "chuanshu-engine"
main = "worker/index.js"
compatibility_date = "2026-09-01"

# 每小时清理超 24h 的匿名用户存档（登录用户数据永久）
[triggers]
crons = ["0 * * * *"]

[assets]
directory = "./public"
binding = "ASSETS"
# 必须为 none：SPA fallback 会把浏览器导航请求（/auth/* 登录跳转等）直接吞成 index.html，
# 导致 worker 的页面级 302（知乎登录/退出）失效；站内页面链接均带 .html 后缀，不依赖 SPA 兜底
not_found_handling = "none"

# KV 命名空间：部署前执行
#   npx wrangler kv namespace create SESSION_KV
#   npx wrangler kv namespace create SAVE_KV
# 然后把返回的 id 填到下面
[[kv_namespaces]]
binding = "SESSION_KV"
id = "f7304fb341c04f75a7fa10b8f74b3029"

[[kv_namespaces]]
binding = "SAVE_KV"
id = "d9a081dc65544cc6b048be41ae5e05da"

# 长期记忆库（worker/memory.js）：D1 绑定，全参数绑定 SQL（migrations/0001_init.sql）
# 2026-09-14 已创建并授权（wrangler login 含 d1:write）
[[d1_databases]]
binding = "DB"
database_name = "chuanshu-memory"
database_id = "036d724e-1d4a-4bc4-bea9-23c00ebcf629"
migrations_dir = "migrations"

[vars]
# 公开配置；密钥走 wrangler secret put
# 模型链（2026-09-14 实测）：
#   deepseek-v4-flash 主力：GM 对话 7.5-12.3s，多角色 who/属性契约 3/3 全对（中转站无 v4.1-flash，最接近的是 v4-pro）；
#   qwen3-max 快稳兜底（6-7s）；glm-5.2 备选（质量优但 14-24s，个别输出慢至 55s+ 致 forge S5 超时，已将阶段超时提至 100s）。
#   qwen3.8-max 通道已失效（秒回空内容）；中转站无 glm-5.3/5.3-flash（5.3 通道 400，5.1 上游 401）。
ZHIHU_OAUTH_APP_ID = "442"
ZHIHU_OAUTH_REDIRECT_URI = "https://chuanshu-engine.xyz/auth/callback"
LLM_BASE_URL = "https://api.openai-next.com/v1"
LLM_MODEL = "deepseek-v4-flash"
LLM_MODEL_FALLBACK = "qwen3-max"
# 演示登录开关：true=点登录直接建立「演示用户」会话（真实知乎授权联调通过后改为 "false" 或删除此行）
OAUTH_MOCK = "true"

# Secrets（不写入本文件）：
#   npx wrangler secret put ZHIHU_OAUTH_APP_KEY
#   npx wrangler secret put LLM_API_KEY
